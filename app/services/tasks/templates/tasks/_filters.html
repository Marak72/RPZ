{# Панель фильтров, общая для доски и списка. Ожидает endpoint в `target`. #}
<div class="toolbar">
  <form method="get" class="inline">
    <div class="search">
      {{ ico.icon('search') }}
      <input type="search" name="q" value="{{ filters.q }}"
             placeholder="Поиск по названию и описанию" data-search-focus>
    </div>
    <select name="assignee" class="input--auto">
      <option value="">Все исполнители</option>
      <option value="none" {% if filters.assignee == 'none' %}selected{% endif %}>Без исполнителя</option>
      {% for p in people %}
      <option value="{{ p.id }}" {% if filters.assignee == p.id|string %}selected{% endif %}>
        {{ p.display_name }}</option>
      {% endfor %}
    </select>
    <select name="service" class="input--auto">
      <option value="">Все сервисы</option>
      {% for svc in filter_services %}
      <option value="{{ svc.id }}" {% if filters.service == svc.id %}selected{% endif %}>
        {{ svc.title }}</option>
      {% endfor %}
    </select>
    <button class="btn btn--sm">Применить</button>
    {% if filters.q or filters.assignee or filters.service or filters.mine or filters.overdue %}
    <a class="btn btn--ghost btn--sm" href="{{ url_for(target) }}">Сбросить</a>
    {% endif %}
  </form>
  <div class="toolbar__spacer"></div>
  <a class="btn btn--sm {% if filters.mine %}btn--primary{% endif %}"
     href="{{ url_for(target, mine='1') }}">Мои</a>
  <a class="btn btn--sm {% if filters.overdue %}btn--primary{% endif %}"
     href="{{ url_for(target, overdue='1') }}">Просроченные</a>
</div>
