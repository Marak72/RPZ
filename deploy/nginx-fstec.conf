# Фрагмент конфигурации nginx для отдачи приложения на подпути /fstec.
#
# Вставьте блок location ВНУТРЬ существующего server { ... } для домена
# soc-dashboards.72to.ru (того, где уже работает сайт в корне и настроен HTTPS).
# Корневой сайт при этом не затрагивается.
#
# После правки:
#   sudo nginx -t && sudo systemctl reload nginx

# Приложение запущено gunicorn-ом на 127.0.0.1:8000 (см. deploy/fstec.service).

location = /fstec {
    # /fstec без слэша -> /fstec/
    return 301 /fstec/;
}

location /fstec/ {
    # Завершающий слэш в proxy_pass срезает префикс /fstec/ перед передачей
    # в приложение, поэтому Flask видит обычные пути ("/", "/login", ...).
    proxy_pass http://127.0.0.1:8000/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Сообщаем приложению префикс, чтобы url_for/редиректы вели на /fstec/...
    proxy_set_header X-Forwarded-Prefix /fstec;

    # Разрешаем загрузку писем до 10 МБ (как MAX_CONTENT_LENGTH в приложении).
    client_max_body_size 10m;
}
