# Фрагмент конфигурации Apache (httpd) для отдачи приложения на подпути /fstec.
#
# Вставьте блоки ВНУТРЬ существующего <VirtualHost *:443> для домена
# soc-dashboards.72to.ru (того, где уже работает сайт в корне и настроен HTTPS).
# Корневой сайт при этом не затрагивается.
#
# Требуются модули: mod_proxy, mod_proxy_http, mod_headers, mod_rewrite
# (на RHEL/CentOS они обычно уже включены в /etc/httpd/conf.modules.d/).
#
# Приложение запущено gunicorn-ом на 127.0.0.1:8000 (см. deploy/fstec.service).
#
# После правки:
#   sudo apachectl configtest && sudo systemctl reload httpd

    # /fstec без слэша -> /fstec/
    RewriteEngine On
    RewriteRule ^/fstec$ /fstec/ [R=301,L]

    <Location /fstec/>
        ProxyPass        http://127.0.0.1:8000/
        ProxyPassReverse http://127.0.0.1:8000/

        # Сообщаем приложению префикс и схему, чтобы url_for/редиректы и
        # cookie сессии формировались как /fstec/... по https.
        RequestHeader set X-Forwarded-Prefix /fstec
        RequestHeader set X-Forwarded-Proto  https
    </Location>
