# Фрагмент конфигурации Apache (httpd) для отдачи портала ИБ на подпути /soc.
#
# Вставьте блоки ВНУТРЬ существующего <VirtualHost *:443> для домена
# soc-dashboards.72to.ru (того, где уже работает сайт в корне и настроен HTTPS).
# Корневой сайт и остальные приложения (/vault/ и т. п.) не затрагиваются.
#
# Что откроется:
#   https://soc-dashboards.72to.ru/soc/          — главная портала
#   https://soc-dashboards.72to.ru/soc/fstec/    — сервис «РПЗ ФСТЭК»
#   https://soc-dashboards.72to.ru/soc/skydns/   — сервис «Угрозы SkyDNS»
#
# Требуются модули: mod_proxy, mod_proxy_http, mod_headers, mod_rewrite
# (на RHEL/CentOS/ALT они обычно уже включены).
#
# Приложение запущено gunicorn-ом на 127.0.0.1:8000 (см. deploy/soc-portal.service).
#
# После правки:
#   sudo apachectl configtest && sudo systemctl reload httpd2

    # /soc без слэша -> /soc/
    RedirectMatch ^/soc$ /soc/

    <Location /soc/>
        Require all granted

        # Завершающий слэш в ProxyPass срезает префикс /soc/ перед передачей
        # в приложение, поэтому Flask видит обычные пути ("/fstec/", "/login").
        #
        # timeout: поиск конечных хостов в MaxPatrol SIEM идёт синхронно
        # в запросе и может занять минуты (по умолчанию было бы 60 с).
        ProxyPass        http://127.0.0.1:8000/ timeout=180
        ProxyPassReverse http://127.0.0.1:8000/

        # Сообщаем приложению префикс и схему, чтобы url_for/редиректы и
        # cookie сессии формировались как /soc/... по https.
        RequestHeader set X-Real-IP          %{REMOTE_ADDR}s
        RequestHeader set X-Forwarded-Proto  "https"
        RequestHeader set X-Forwarded-Port   "443"
        RequestHeader set X-Forwarded-Prefix "/soc"
    </Location>
