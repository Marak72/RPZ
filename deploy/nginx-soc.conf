# Фрагмент конфигурации nginx для отдачи портала ИБ на подпути /soc.
#
# Вставьте блок location ВНУТРЬ существующего server { ... } для домена
# soc-dashboards.72to.ru (того, где уже работает сайт в корне и настроен HTTPS).
# Корневой сайт и остальные приложения не затрагиваются.
#
# Что откроется:
#   /soc/          — главная портала
#   /soc/fstec/    — сервис «РПЗ ФСТЭК»
#   /soc/skydns/   — сервис «Угрозы SkyDNS»
#
# После правки:
#   sudo nginx -t && sudo systemctl reload nginx

# Приложение запущено gunicorn-ом на 127.0.0.1:8000 (см. deploy/soc-portal.service).

location = /soc {
    # /soc без слэша -> /soc/
    return 301 /soc/;
}

location /soc/ {
    # Завершающий слэш в proxy_pass срезает префикс /soc/ перед передачей
    # в приложение, поэтому Flask видит обычные пути ("/fstec/", "/login").
    proxy_pass http://127.0.0.1:8000/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Сообщаем приложению префикс, чтобы url_for/редиректы вели на /soc/...
    proxy_set_header X-Forwarded-Prefix /soc;

    # Разрешаем загрузку писем до 10 МБ (как MAX_CONTENT_LENGTH в приложении).
    client_max_body_size 10m;

    # Поиск конечных хостов в MaxPatrol SIEM идёт синхронно в запросе и может
    # занять минуты: без этого nginx отдаст 504 раньше, чем ответит SIEM.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
